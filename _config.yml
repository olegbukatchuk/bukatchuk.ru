# ——— Рассылка ———
subscribe:
  title: Раз в неделю — что сломалось<br>и почему это было видно заранее
  lead: >
    Разборы аварий, заметки по эксплуатации и то, что не попадает в статьи.
    Без анонсов вебинаров и без «полезных подборок».
  note: Отписаться можно одним кликом из любого письма. Адрес не передаётся третьим лицам.
  action: "https://olegbukatchuk.substack.com/subscribe"

# ——— Комментарии ———
# utteranc.es складывает комментарии в issues указанного репозитория.
comments:
  enabled: false
  repo: ""

# ——— Аналитика ———
# plausible: true включает счётчик в production
plausible: false

# ——— Соцсети ———
social_sites:
  github: olegbukatchuk
  linkedin: olegbukatchuk
  youtube: "@oleg.bukatchuk"

# ——— Сборка ———
markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
highlighter: rouge
future: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - tmp
  - LICENSE
  - keybase.txt
  - frontmatter.json
