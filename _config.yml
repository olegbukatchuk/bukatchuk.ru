telegram: https://t.me/bukatchuk
description: >
  Разборы аварий, эксплуатация нагруженных систем и то, что об этом не пишут
  в документации.
lang: ru
timezone: Europe/Moscow
url: "https://bukatchuk.ru"
baseurl: ""
permalink: pretty

# ——— Автор ———
author:
  name: Олег Букатчук
  role: надёжность и эксплуатация
  # Возраст на странице «Об авторе» считается от этой даты: {% include age.html %}
  birthday: 1983-08-03
  bio_short: >
    DevOps- и SRE-инженер. Строил отказоустойчивую инфраструктуру для классифайда,
    e-commerce и госсектора: cian.ru, aliexpress.ru, mos.ru.

# ——— Стаж ———
# Единственное место, где записан год начала. Число лет считается само:
# {% include years.html %} — число, {% include years-word.html %} — прописью.
career:
  ops_since: 2007

# ——— Главная ———
home:
  # [years] заменяется на стаж числом: «19 лет», «21 год»
  headline: Заметки инженера,<br>который чинит продакшн [years]
  lead: >
    Разборы аварий, эксплуатация нагруженных систем и то, что об этом не пишут
    в документации. Здесь без «десяти лайфхаков» — только то, что проверено
    на боевых системах.
  meta_third: Читают в Хабре и Телеграме
  # Сколько статей показывать в каждом из трёх блоков главной
  limit: 3
  # Статья попадает в блок «Техника», если у неё есть хотя бы один из этих тегов.
  # С тегом music — в «Музыку», всё прочее — в «Развитие».
  tech_tags: [ai, llm, mcp, docker, kanban, security, forensics, linux, macos, windows, bash, base64, devops, sre, kubernetes, git, python, terraform, ansible]
  # Бегущие строки между блоками: темы программы курса
  course:
    title: Курс DevOps-инженера
    url: "https://devops.bukatchuk.ru/program/"
    topics:
      - Введение в профессию и рабочее окружение
      - "Linux: устройство системы и повседневная работа"
      - Git и работа с кодом в команде
      - Bash и автоматизация в командной строке
      - "Сети: от кадра до HTTPS"
      - Python для инженера эксплуатации
      - "Приложения и данные: что мы вообще эксплуатируем"
      - Контейнеры и Docker
      - "CI/CD: непрерывная интеграция и доставка"
      - "Управление конфигурацией: Ansible"
      - "Облака: модель, сервисы, Yandex Cloud на практике"
      - "Инфраструктура как код: Terraform"
      - "Kubernetes: основы"
      - "Kubernetes: эксплуатация, безопасность и GitOps"
      - Kubernetes в облаке
      - "Наблюдаемость: метрики, логи, трассировки"
      - Надёжность и практики SRE
      - Безопасность инфраструктуры и DevSecOps
      - Платформенная инженерия и опыт разработчика
      - Экономика, процессы и коммуникация
      - AI в эксплуатации
      - Итоговый проект и выход на работу
  facts:
    - n: "3"
      l: проекта-миллионника
    - n: "10 000"
      l: читателей последнего разбора

