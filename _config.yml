# ——— Сборка ———
markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
highlighter: rouge
future: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
