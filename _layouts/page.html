---
layout: default
---
<section class="hero">
  <div class="hero__in">
    <p class="eyebrow">// {{ page.eyebrow | default: page.title }}</p>
    <h1>{{ page.headline | default: page.title | escape }}</h1>
    {%- if page.lead or page.description %}
    <p class="hero__sub">{{ page.lead | default: page.description }}</p>
    {%- endif %}
  </div>
</section>

<section class="sec--hair">
  <div class="wrap">
    <div class="page__body">
      {{ content }}
    </div>
  </div>
</section>
