<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.url == "/" %}{{ page.title | escape }}{% elsif page.title %}{{ page.title | escape }} — {{ site.author.name | default: site.title }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/logo.png' | relative_url }}">

  <link rel="preload" href="{{ '/assets/fonts/axis/jetbrains-mono-cyrillic.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/axis/ibm-plex-sans-cyrillic.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  {%- if page.math %}{% include mathjax.html %}{% endif %}
  {% if jekyll.environment == 'production' and site.plausible %}{% include plausible.html %}{% endif %}
  {% seo title=false %}
</head>
