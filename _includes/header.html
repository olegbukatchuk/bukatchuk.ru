<header class="hdr">
  <div class="hdr__in">
    <a href="https://bukatchuk.ru" class="hdr__logo">
      <img class="hdr__mark" src="{{ '/assets/logo.png' | relative_url }}" alt="" width="22" height="22">{{ site.brand | default: 'bukatchuk' }}
    </a>
    <span class="hdr__sep"></span>
    <span class="hdr__sub">{{ page.header_sub | default: site.header_sub }}</span>
    <nav class="hdr__nav" id="nav">
      {%- for l in site.nav %}
      <a href="{{ l.href | relative_url }}"{% if page.url == l.href or page.nav_active == l.href %} class="is-active"{% endif %}>{{ l.text }}</a>
      {%- endfor %}
    </nav>
    <div class="hdr__right"><a class="hdr__rss" href="{{ '/feed.xml' | relative_url }}">RSS</a></div>
    <button class="burger" id="burger" aria-label="Меню" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>
