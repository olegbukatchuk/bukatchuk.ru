{%- comment -%}
  Комментарии. Включаются в _config.yml: comments.enabled: true
  и своим репозиторием в comments.repo — utteranc.es складывает их в issues.
{%- endcomment -%}
<script src="https://utteranc.es/client.js"
        repo="{{ site.comments.repo }}"
        issue-term="pathname"
        theme="github-light"
        crossorigin="anonymous"
        async></script>
